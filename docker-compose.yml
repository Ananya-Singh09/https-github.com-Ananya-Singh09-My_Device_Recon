version: "3.9"
services:
  dashboard:
    build: .
    container_name: device_recon_dashboard
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: unless-stopped

  scanner:
    build: .
    container_name: device_recon_scanner
    command: ["python", "auto.py"]
    volumes:
      - .:/app
    restart: unless-stopped

